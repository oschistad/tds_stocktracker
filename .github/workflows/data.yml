name: fetch-data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC, after US close

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas pyarrow requests
      - name: Fetch posts (gap fill + fresh)
        run: python scripts/fetch_posts.py
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh posts + prices"
          git push
